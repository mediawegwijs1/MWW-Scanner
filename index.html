<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Video Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            margin: 0; padding: 20px; background-color: #121212; color: #ffffff;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            align-items: center; height: 100vh; box-sizing: border-box; text-align: center;
            position: relative;
        }
        h2 { margin-bottom: 5px; }
        
        #reader {
            width: 100%; max-width: 600px; border-radius: 10px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); background: #000; display: none; margin-top: 20px;
        }
        
        .btn-blue {
            background-color: #007BFF; color: white; border: none; padding: 20px 40px;
            font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-top: 50px;
        }
        
        #success-container { 
            display: none; margin-top: 40px; background-color: #1e1e1e; 
            padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            width: 100%; max-width: 400px;
        }
        
        .scanned-url {
            word-wrap: break-word; color: #aaaaaa; margin-bottom: 25px; font-size: 16px;
        }
        
        .btn-green {
            display: block; background-color: #00C851; color: #000; font-weight: bold;
            font-size: 20px; padding: 15px 30px; text-decoration: none; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 15px; cursor: pointer;
            border: none; width: 100%; box-sizing: border-box;
        }
        .btn-gray {
            display: block; width: 100%; background-color: #555; color: #fff; font-size: 16px;
            padding: 12px 20px; text-decoration: none; border-radius: 8px; border: none; cursor: pointer;
        }
        #error-message { color: #ff4444; font-weight: bold; height: 25px; margin-top: 10px; }

        #version-tag {
            position: fixed;
            bottom: 15px;
            left: 15px;
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            z-index: 9999;
            pointer-events: none;
            user-select: none;
        }

        /* Onzichtbare iframe voor cookie/sessie preloading */
        #session-loader {
            display: none;
            width: 0;
            height: 0;
            border: none;
        }
    </style>
</head>
<body>

    <h2>Video Scanner</h2>
    <p style="color: #888; margin-top: 0;">Scan de code om video's in te leveren</p>
    <div id="error-message"></div>
    
    <button id="start-btn" class="btn-blue">Start de Camera</button>
    <div id="reader"></div>

    <div id="success-container">
        <h3 style="color: #00C851; margin-top: 0;">Code geaccepteerd!</h3>
        <div id="scanned-text" class="scanned-url">Hier komt de link</div>
        
        <button id="final-link" class="btn-green">Open inlever-link</button>
        <button class="btn-gray" onclick="location.reload()">Opnieuw scannen</button>
    </div>

    <!-- Onzichtbare container voor het inladen van de sessie -->
    <iframe id="session-loader" src="about:blank"></iframe>

    <div id="version-tag">Laden...</div>

    <script>
        async function syncVersionAndCache() {
            try {
                const response = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) return;

                const data = await response.json();
                const latestVersion = data.version;
                const storedVersion = localStorage.getItem('mww_app_version');

                document.getElementById('version-tag').innerText = 'v' + latestVersion;

                if (storedVersion && storedVersion !== latestVersion) {
                    localStorage.clear();
                    sessionStorage.clear();
                    localStorage.setItem('mww_app_version', latestVersion);

                    const cleanUrl = window.location.origin + window.location.pathname;
                    window.location.replace(cleanUrl + '?v=' + latestVersion + '&t=' + Date.now());
                } else {
                    localStorage.setItem('mww_app_version', latestVersion);
                }
            } catch (e) {
                document.getElementById('version-tag').innerText = 'v0.5';
                console.warn("Versiecontrole niet geslaagd:", e);
            }
        }

        syncVersionAndCache();

        let targetDestinationUrl = "";

        document.getElementById('start-btn').addEventListener('click', function() {
            this.style.display = 'none';
            document.getElementById('reader').style.display = 'block';

            // Start direct met het voorbereiden van de domein-sessie via iframe
            const iframe = document.getElementById('session-loader');
            iframe.src = "https://file.kiwi/";

            const html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            const errorEl = document.getElementById("error-message");

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                function(decodedText) {
                    if (decodedText.startsWith("https://file.kiwi/") || decodedText.startsWith("http://file.kiwi/")) {
                        html5QrCode.stop().then(() => {
                            document.getElementById("reader").style.display = "none";
                            errorEl.style.display = "none";
                            document.getElementById("success-container").style.display = "block";
                            
                            targetDestinationUrl = decodedText;
                            document.getElementById("scanned-text").innerText = targetDestinationUrl;

                            // Probeer postMessage naar de geladen iframe te sturen voor taalvoorkeur
                            try {
                                iframe.contentWindow.postMessage({ type: 'SET_LANGUAGE', lang: 'en' }, '*');
                                iframe.contentWindow.postMessage({ action: 'setLocale', locale: 'en' }, '*');
                            } catch (e) {
                                // Cross-origin restricties stil negeren
                            }

                        }).catch(err => {
                            console.error(err);
                        });
                    } else {
                        errorEl.innerText = "Let op: Dit is geen file.kiwi inlever-link.";
                        setTimeout(() => { errorEl.innerText = ""; }, 3000);
                    }
                },
                function(errorMessage) {
                    // Frame scan skips negeren
                }
            ).catch(function(err) {
                alert("Fout: Kon de camera niet openen. Controleer de rechten.");
            });
        });

        // Bij klikken op de knop navigeren
        document.getElementById("final-link").addEventListener('click', function() {
            if (!targetDestinationUrl) return;
            
            // Direct doorsturen binnen dezelfde Hexnode Browser
            window.location.href = targetDestinationUrl;
        });
    </script>

</body>
</html>
